{% extends "core/base.html" %}

{% block content %}

<!-- LISTAS -->
<div class="list-container">
    <h3>Tendencias</h3>
    <div id="pelis-tendencias" class="peliculas-container">
        <p style="color:#ccc;">Cargando...</p>
    </div>
</div>

<div class="list-container">
    <h3>Recientes</h3>
    <div id="pelis-recientes" class="peliculas-container">
        <p style="color:#ccc;">Cargando...</p>
    </div>
</div>

<script>
/* ==========================
      CARGAR LISTAS
========================== */
async function cargarLista(idContenedor){
    const cont = document.getElementById(idContenedor);
    try {
        const res = await fetch("/api/peliculas/");
        const data = await res.json();
        const pelis = data.results || data;

        cont.innerHTML = "";

        pelis.forEach(p => {
            cont.innerHTML += `
                <div class="card">
                    <a href="/pelicula/${p.id}/">
                        <img src="/static/img/poster_default.jpg" class="poster">
                    </a>
                    <div class="info">
                        <h3>${p.nombre}</h3>
                        <p>${p.genero || "Género desconocido"}</p>
                    </div>
                </div>
            `;
        });
    } catch(e){
        cont.innerHTML = "<p style='color:red;'>Error cargando películas</p>";
    }
}

cargarLista("pelis-tendencias");
cargarLista("pelis-recientes");
</script>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>UANFilms</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header>
    <div class="header-left">
        <button class="btn-login" onclick="abrirLogin()">Iniciar Sesión</button>

        <div id="usuario-logueado" class="usuario-logueado" style="display:none;">
            👤 <span id="username"></span>
        </div>
    </div>

    <div class="header-center">
        🎬 UANFilms
    </div>
</header>

</body>
</html>
