{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>UANFilms</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header>🎬 UANFilms</header>

<!-- TENDENCIAS -->
<div class="list-container">
    <h3>Tendencias</h3>
    <div id="pelis-tendencias" class="peliculas-container">
        <p style="color:#ccc;">Cargando...</p>
    </div>
</div>

<!-- RECIENTES -->
<div class="list-container">
    <h3>Recientes</h3>
    <div id="pelis-recientes" class="peliculas-container">
        <p style="color:#ccc;">Cargando...</p>
    </div>
</div>

<script>

async function cargarLista(idContenedor){
    const cont = document.getElementById(idContenedor);

    try {
        const res = await fetch("/api/peliculas/");
        const data = await res.json();
        const pelis = Array.isArray(data) ? data : data.results || [];

        cont.innerHTML = "";

        pelis.forEach(p => {

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <a href="/pelicula/${p.id}/">
                    <img src="/static/img/poster_default.jpg"
                        alt="${p.nombre}" class="poster">
                </a>
                <div class="info">
                    <h3>${p.nombre}</h3> 
                    <p>${p.genero || "Género desconocido"}</p>
                </div>
            `;

            cont.appendChild(card);
        });

    } catch (e) {
        console.error("Error:", e);
        cont.innerHTML = "<p style='color:red;'>Error cargando películas</p>";
    }
}

cargarLista("pelis-tendencias");
cargarLista("pelis-recientes");

</script>

</body>
</html>
